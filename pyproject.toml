[project]
name = "cpen455-cache-project"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "tiktoken==0.14.0",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cu126 = ["torch==2.14.1; sys_platform != 'darwin'"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
